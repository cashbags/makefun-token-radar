<!-- Token Radar dashboard shell, radar-2.
     The page is a shell: it loads data.js (window.RADAR, written by
     main.ts), app.css for the theme and app.js for the rendering.
     No network requests after load; the board, the filters and the
     detail panel all run off the in-page dataset.
     The three captured views are the full board, one protocol's
     detail panel, and the Lending filter (14 rows).
     The shell carries no data of its own: swap data.js and the same
     page renders a different snapshot's board. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<main id="board" tabindex="-1" aria-busy="true"></main>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
